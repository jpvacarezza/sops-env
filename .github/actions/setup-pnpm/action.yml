name: Set up pnpm
description: Install pnpm, Node 24 with the pnpm store cached, and the frozen-lockfile dependencies.

runs:
  using: composite
  steps:
    # No `version:`: package.json `packageManager` pins pnpm, and giving both
    # can fail as "multiple versions of pnpm specified".
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm

    # Frozen install re-applies the lockfile and the minimumReleaseAge gate.
    - run: pnpm install --frozen-lockfile
      shell: bash
