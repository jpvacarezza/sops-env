name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Refuse to publish anything but a deliberate, consistent release: an
      # annotated tag, whose version is the one in package.json, and which the
      # remote still resolves to the commit we are about to release.
      # Annotation is read from the remote, not the local ref: checkout can
      # rewrite a tag ref locally, which would hide the difference.
      - name: Verify the tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          raw="$(git ls-remote origin "refs/tags/${tag}" | cut -f1)"
          peeled="$(git ls-remote origin "refs/tags/${tag}^{}" | cut -f1)"
          [ -n "${peeled}" ] || { echo "${tag} is not an annotated tag"; exit 1; }
          [ "${raw}" != "${peeled}" ] || { echo "${tag} is not an annotated tag"; exit 1; }
          pkg="$(node -p "require('./package.json').version")"
          [ "${pkg}" = "${tag#v}" ] || { echo "package.json version ${pkg} != tag ${tag}"; exit 1; }
          head="$(git rev-parse HEAD)"
          [ "${peeled}" = "${head}" ] || { echo "remote ${tag} resolves to ${peeled}, checked out ${head}"; exit 1; }

      # Notes are the CHANGELOG section for this tag, so the release page and
      # the file cannot drift.
      - name: Extract release notes
        run: |
          set -euo pipefail
          awk -v tag="${GITHUB_REF_NAME}" '
            $0 ~ "^## " tag " " { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          test -s "${RUNNER_TEMP}/notes.md" || { echo "no CHANGELOG section for ${GITHUB_REF_NAME}"; exit 1; }

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/notes.md" --verify-tag
