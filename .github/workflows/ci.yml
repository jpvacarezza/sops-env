name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Pin sops to the version the code is measured against.
      - name: Install sops
        run: |
          curl -sSLo /usr/local/bin/sops \
            "https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64"
          chmod +x /usr/local/bin/sops
          sops --version

      - run: pnpm test
        env:
          CI: '1'

      - run: pnpm lint

      - run: pnpm format:check

      - run: node --check bin/sops-env.mjs

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks_linux_x64.tar.gz"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "${HOME}/bin" && tar -xzf "${archive}" -C "${HOME}/bin" gitleaks
          echo "${HOME}/bin" >> "${GITHUB_PATH}"

      - name: Scan working tree for secrets
        run: gitleaks dir --verbose --redact --no-banner --config .gitleaks.toml .
