name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pnpm

      # Pin sops to the version the code is measured against.
      - name: Install sops
        env:
          SOPS_VERSION: '3.11.0'
          # The sops-v3.11.0.linux.amd64 line of
          # https://github.com/getsops/sops/releases/download/v3.11.0/sops-v3.11.0.checksums.txt
          SOPS_SHA256: '775f1384d55decfad228e7196a3f683791914f92a473f78fc47700531c29dfef'
        run: |
          set -euo pipefail
          binary="${RUNNER_TEMP}/sops"
          curl -fsSL "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64" -o "${binary}"
          echo "${SOPS_SHA256}  ${binary}" | sha256sum -c -
          mkdir -p "${HOME}/bin" && install -m 0755 "${binary}" "${HOME}/bin/sops"
          echo "${HOME}/bin" >> "${GITHUB_PATH}"
          "${HOME}/bin/sops" --version

      - run: pnpm test
        env:
          CI: '1'

      - run: pnpm lint

      - run: pnpm format:check

      - run: node --check bin/sops-env.mjs

      # The published tarball is `files` + `exports`; fail if either points at
      # something that is not packed.
      - name: Verify the package contents
        run: |
          set -euo pipefail
          pnpm pack --pack-destination "${RUNNER_TEMP}"
          tarball="$(ls "${RUNNER_TEMP}"/sops-env-*.tgz)"
          listing="$(tar -tzf "${tarball}")"
          for path in package/bin/sops-env.mjs package/src/index.mjs package/src/providers/index.mjs package/src/config/types.d.ts package/LICENSE; do
            grep -qx "${path}" <<<"${listing}" || { echo "missing from tarball: ${path}"; exit 1; }
          done
          if grep -q '\.spec\.mjs$' <<<"${listing}"; then echo "spec files packed"; exit 1; fi

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks_linux_x64.tar.gz"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "${HOME}/bin" && tar -xzf "${archive}" -C "${HOME}/bin" gitleaks
          echo "${HOME}/bin" >> "${GITHUB_PATH}"

      - name: Scan working tree for secrets
        run: gitleaks dir --verbose --redact --no-banner --config .gitleaks.toml .

  # The tool is used on Windows laptops; the POSIX job does not prove that.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pnpm

      - name: Install sops
        shell: bash
        env:
          SOPS_VERSION: '3.11.0'
          # The sops-v3.11.0.amd64.exe line of the release checksums file.
          SOPS_SHA256: 'f3d74d83006954f0d8cf770ad7e5380504270ded5a62f33eb2548ce5461af3b3'
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/sops-bin"
          mkdir -p "${dir}"
          curl -fsSL "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.amd64.exe" -o "${dir}/sops.exe"
          echo "${SOPS_SHA256}  ${dir}/sops.exe" | sha256sum -c -
          echo "${dir}" >> "${GITHUB_PATH}"

      - run: pnpm test
        env:
          CI: '1'

  # Advisory gate on the dependency tree. `--audit-level=high` keeps moderate
  # and low advisories (often unreachable dev-only noise) from blocking merges
  # while still failing on anything that is realistically exploitable. Run for
  # prod only first so a runtime advisory is named as such, then for the whole
  # tree (dev tooling runs in CI and on laptops, so it is an attack surface).
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pnpm

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Audit all dependencies
        run: pnpm audit --audit-level=high
