name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version:`: package.json `packageManager` pins pnpm, and giving both
      # can fail as "multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Pin sops to the version the code is measured against.
      - name: Install sops
        env:
          SOPS_VERSION: '3.9.4'
          # The sops-v3.9.4.linux.amd64 line of
          # https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.checksums.txt
          SOPS_SHA256: '5488e32bc471de7982ad895dd054bbab3ab91c417a118426134551e9626e4e85'
        run: |
          set -euo pipefail
          binary="${RUNNER_TEMP}/sops"
          curl -fsSL "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64" -o "${binary}"
          echo "${SOPS_SHA256}  ${binary}" | sha256sum -c -
          mkdir -p "${HOME}/bin" && install -m 0755 "${binary}" "${HOME}/bin/sops"
          echo "${HOME}/bin" >> "${GITHUB_PATH}"
          "${HOME}/bin/sops" --version

      - run: pnpm test
        env:
          CI: '1'

      - run: pnpm lint

      - run: pnpm format:check

      - run: node --check bin/sops-env.mjs

      # The published tarball is `files` + `exports`; fail if either points at
      # something that is not packed.
      - name: Verify the package contents
        run: |
          set -euo pipefail
          pnpm pack --pack-destination "${RUNNER_TEMP}"
          tarball="$(ls "${RUNNER_TEMP}"/sops-env-*.tgz)"
          listing="$(tar -tzf "${tarball}")"
          for path in package/bin/sops-env.mjs package/src/index.mjs package/src/providers/index.mjs package/src/config/types.d.ts package/LICENSE; do
            grep -qx "${path}" <<<"${listing}" || { echo "missing from tarball: ${path}"; exit 1; }
          done
          if grep -q '\.spec\.mjs$' <<<"${listing}"; then echo "spec files packed"; exit 1; fi

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks_linux_x64.tar.gz"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "${HOME}/bin" && tar -xzf "${archive}" -C "${HOME}/bin" gitleaks
          echo "${HOME}/bin" >> "${GITHUB_PATH}"

      - name: Scan working tree for secrets
        run: gitleaks dir --verbose --redact --no-banner --config .gitleaks.toml .

  # The tool is used on Windows laptops; the POSIX job does not prove that.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install sops
        shell: bash
        env:
          SOPS_VERSION: '3.9.4'
          # The sops-v3.9.4.exe line of the release checksums file.
          SOPS_SHA256: 'bee270926fc55b5b89ed9ce87fb2569a36c74e99d63e6392090b3d0f0c2775eb'
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/sops-bin"
          mkdir -p "${dir}"
          curl -fsSL "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.exe" -o "${dir}/sops.exe"
          echo "${SOPS_SHA256}  ${dir}/sops.exe" | sha256sum -c -
          echo "${dir}" >> "${GITHUB_PATH}"

      - run: pnpm test
        env:
          CI: '1'
